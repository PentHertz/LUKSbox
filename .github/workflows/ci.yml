# Push + PR CI for luksbox.
#
# Runs on every push to main and every PR. Designed for fast feedback
# (~5 min wall-clock for the full matrix), NOT a substitute for the
# longer fuzz campaigns under scripts/fuzz_server.sh, which run on a
# dedicated server. See FUZZING.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0       # smaller, more reproducible CI builds
  RUST_BACKTRACE: 1

jobs:
  # ---- Format + clippy gate (fast, ~30s) -----------------------------------
  lint:
    name: fmt + clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-lint
      - name: Linux deps
        uses: ./.github/actions/apt-install
        with:
          packages: |
            pkg-config libfido2-dev libssl-dev libudev-dev zlib1g-dev
            libtss2-dev
      - run: cargo fmt --all -- --check
      # Workspace-wide clippy. NOT `-D warnings` yet, there's a backlog of
      # too_many_arguments / auto_deref nits we don't want to gate on. Run
      # without `-D` so the CI signal is informational; tighten as warnings
      # are fixed.
      - run: cargo clippy --workspace --all-targets

  # ---- Full test matrix ---------------------------------------------------
  test:
    name: test (${{ matrix.profile }})
    runs-on: ubuntu-22.04
    # Force the tss-esapi-sys pkg-config probes of the vendored
    # (static-only) tpm2-tss into STATIC mode on the bundled-tpm lane.
    # Dynamic mode never reads Libs.private (so -lcrypto goes missing:
    # "undefined symbol: EVP_MD_fetch" in the test binaries) and emits
    # each -ltss2-* alone, which GNU ld resolves strictly left to
    # right ("undefined reference to Tss2_Sys_*"). Static mode expands
    # each probe's full Requires / Libs.private closure in topological
    # order. Mirrors the [env] block in .cargo/config.toml; kept here
    # too so CI never depends on that file being in sync. Scoped by
    # library name, so the plain workspace lane is unaffected.
    #
    # CFLAGS: compile the vendored tpm2-tss without SM4, matching the
    # release lanes. Ubuntu's OpenSSL ships SM4 but Fedora/RHEL's is
    # built without it, so release binaries drop the EVP_sm4_cfb128
    # dependency; CI builds the same shape so it tests what ships.
    # LUKSbox only negotiates AES-CFB TPM sessions, nothing is lost.
    #
    # LUKSBOX_REQUIRE_MOUNT_TESTS: the FUSE mount tests
    # (luksbox-mount/tests/fuse_mount.rs and the cross-process
    # mount/umount test, luksbox-cli/tests/mount_cross_process.rs) skip
    # on hosts that can't mount; here they fail instead, so a runner
    # without a usable /dev/fuse or fusermount3 (fuse3, installed below)
    # can't pass without testing.
    env:
      TSS2_SYS_STATIC: "1"
      TSS2_ESYS_STATIC: "1"
      TSS2_MU_STATIC: "1"
      TSS2_TCTILDR_STATIC: "1"
      CFLAGS: "-DOPENSSL_NO_SM4"
      LUKSBOX_REQUIRE_MOUNT_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: workspace
            features: ""
            cmd: "cargo test --workspace --exclude luksbox-gui --exclude luksbox-fuzz --exclude luksbox-fuzz-afl"
          # bundled-tpm, not hardware: this job runs on jammy, whose
          # system tpm2-tss (3.2) is below the 4.1.3 build floor that
          # tss-esapi 8.x imposes. bundled-tpm compiles a vendored
          # tpm2-tss at build time (hence the autotools packages in the
          # apt list below); the system-link `hardware` flavour is
          # exercised by the 26.04 lane, whose tpm2-tss is new enough.
          - profile: workspace-hardware
            features: "luksbox-cli/bundled-tpm"
            cmd: "cargo test --workspace --features luksbox-cli/bundled-tpm --exclude luksbox-gui --exclude luksbox-fuzz --exclude luksbox-fuzz-afl"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # `-tss420`: tpm2-tss 4.1.3 -> 4.2.0. tss-esapi-sys declares no
          # rerun-if-* triggers, so an old cache would keep the old
          # vendored tpm2-tss despite the new staged source.
          shared-key: ci-test-tss420-${{ matrix.profile }}
      - name: Linux deps
        uses: ./.github/actions/apt-install
        with:
          packages: |
            pkg-config libfido2-dev libssl-dev libudev-dev zlib1g-dev
            libtss2-dev fuse3
            autoconf automake libtool libltdl-dev autoconf-archive libjson-c-dev uuid-dev
      - name: Stage pinned tpm2-tss source (bundled-tpm lane)
        # Test the tpm2-tss the release builds ship (scripts/stage_tpm2_tss.sh),
        # not the 4.1.3 tss-esapi-sys would git-clone on its own.
        if: contains(matrix.features, 'bundled-tpm')
        run: echo "TPM2_TSS_SOURCE_PATH=$(bash scripts/stage_tpm2_tss.sh "$RUNNER_TEMP/tpm2-tss-src")" >> "$GITHUB_ENV"
      - name: Run ${{ matrix.profile }} tests
        run: ${{ matrix.cmd }}

  # ---- Ubuntu 26.04 (resolute) compatibility lane ------------------------
  # Builds + runs the workspace test suite against the Ubuntu 26.04
  # ("resolute") library + toolchain stack -- newer libfido2 / libtss2 /
  # openssl / glibc than the 22.04 host runners the rest of the matrix
  # uses. This is the lane that catches the "new distro bumped a -dev
  # package soname / API" breakage class (cf. the Debian trixie fixes).
  #
  # Runs INSIDE an `ubuntu:26.04` container on a 24.04 host because
  # GitHub does not (yet) publish a native `ubuntu-26.04` hosted runner
  # image; the container pins the real 26.04 package set, which is the
  # whole point of the check. Same containerised pattern release.yml
  # uses for the Debian trixie .deb build. Switch `runs-on` to
  # `ubuntu-26.04` and drop the `container:` line once GitHub ships the
  # native image.
  test-ubuntu-2604:
    name: test 26.04 resolute (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: workspace
            cmd: "cargo test --workspace --exclude luksbox-gui --exclude luksbox-fuzz --exclude luksbox-fuzz-afl"
          - profile: workspace-hardware
            cmd: "cargo test --workspace --features luksbox-cli/hardware --exclude luksbox-gui --exclude luksbox-fuzz --exclude luksbox-fuzz-afl"
    steps:
      # The bare ubuntu:26.04 image lacks git (checkout), curl +
      # ca-certificates (rustup installer download), and a C toolchain
      # (linking + libfido2-sys bindgen). Install them BEFORE checkout
      # and the toolchain action, same ordering as release.yml's
      # container bootstrap.
      - name: Bootstrap container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-test-2604-${{ matrix.profile }}
      - name: Linux deps
        uses: ./.github/actions/apt-install
        with:
          # libclang-dev + clang are pre-installed on the hosted ubuntu
          # runners (no-op there) but NOT in the bare container:
          # libfido2-sys's build script runs bindgen, which needs
          # libclang to parse the system libfido2 headers.
          packages: |
            pkg-config libfido2-dev libssl-dev libudev-dev zlib1g-dev
            libtss2-dev libclang-dev clang
      - name: Run ${{ matrix.profile }} tests
        run: ${{ matrix.cmd }}

  # ---- macOS (Apple Silicon) ----------------------------------------------
  # The test suite on macOS, which no other job runs. Builds the FUSE-T
  # flavour (release.yml's `fuset` .dmg): fuser needs macFUSE's fuse.pc
  # to build on macOS, and macFUSE's kernel extension can't load on a
  # hosted runner anyway, so the macFUSE flavour stays covered by the
  # release build only. `luksbox-cli/hardware` and `luksbox-sep/hardware`
  # compile the Secure Enclave backend (Swift shim); runners have no
  # Secure Enclave, so its round-trip test no-ops, like the TPM tests on
  # the Windows job.
  #
  # luksbox-cli and luksbox-mount get their own step because
  # `cargo test --workspace` would build luksbox-mount with its default
  # `fuse` (macFUSE) feature. The cross-process mount/umount test runs
  # in a separate non-blocking step until a run shows FUSE-T can mount
  # on GitHub's macOS runners; then drop its `continue-on-error` so it
  # gates like on Linux and Windows.
  test-macos:
    name: test macOS (FUSE-T)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-test-macos
      - name: macOS deps (Homebrew)
        # HOMEBREW_NO_INSTALL_FROM_API: see the same step in release.yml
        # (Homebrew's cask API parser regression).
        env:
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          set -euo pipefail
          brew update
          brew install --formula libfido2 pkg-config
          # FUSE-T: luksbox-fuse-t (a workspace member) needs its headers
          # and fuse-t.pc to build.
          brew tap macos-fuse-t/homebrew-cask
          brew install --cask fuse-t
          FUSE_PC_PATH=""
          for cand in /usr/local/lib/pkgconfig /opt/homebrew/lib/pkgconfig; do
              if [ -f "$cand/fuse-t.pc" ]; then
                  FUSE_PC_PATH="$cand"
                  break
              fi
          done
          if [ -z "$FUSE_PC_PATH" ]; then
              echo "::error::FUSE-T installed but fuse-t.pc not found in /usr/local/lib/pkgconfig or /opt/homebrew/lib/pkgconfig"
              exit 1
          fi
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix libfido2)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$FUSE_PC_PATH"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix libfido2)/lib"
          } >> "$GITHUB_ENV"
      - name: Test workspace (except CLI and mount)
        run: cargo test --workspace --features luksbox-sep/hardware --exclude luksbox-cli --exclude luksbox-mount --exclude luksbox-gui --exclude luksbox-fuzz --exclude luksbox-fuzz-afl
      - name: Test CLI and mount (FUSE-T, Secure Enclave)
        run: cargo test -p luksbox-cli -p luksbox-mount --no-default-features --features luksbox-cli/hardware,luksbox-cli/fuse-t -- --skip umount_from_another_process
      - name: Cross-process mount / umount (FUSE-T, non-blocking)
        continue-on-error: true
        # A hung NFS (FUSE-T) mount can block a read for good; don't let
        # it hold the runner for the 6 h job default.
        timeout-minutes: 10
        env:
          LUKSBOX_REQUIRE_MOUNT_TESTS: "1"
        run: cargo test -p luksbox-cli --no-default-features --features hardware,fuse-t --test mount_cross_process -- --nocapture

  # ---- Windows mount integration tests (WinFsp kernel mount) -------------
  # Mounts a real luksbox vault on a free drive letter via the WinFsp
  # kernel driver, exercises it through Win32, then tears it down. Catches
  # the class of bug that motivated writing them: `FileSystem::start`
  # returning Ok while Win32 still reports the volume as unrecognized
  # (the OVERWRITE_DEFINED regression). See
  # crates/luksbox-mount/src/winfsp.rs top-of-file gotcha catalogue.
  #
  # Stays in its own job because:
  #   1. It needs a `windows-latest` runner (3x more expensive than
  #      ubuntu-latest minutes, so we keep it off the per-PR critical
  #      path and re-evaluate cost after a few months of data).
  #   2. WinFsp install via choco takes ~30 s on a cold runner -
  #      unrelated to anything Linux jobs do, so parallelizing it out
  #      keeps the rest of the matrix snappy.
  #   3. `--test-threads=1` is required (the tests share the global
  #      drive-letter pool) - running them alongside Linux jobs would
  #      not have helped throughput anyway.
  windows-mount:
    name: WinFsp mount integration tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-windows-mount
      - name: Install WinFsp (kernel driver + SDK)
        shell: pwsh
        run: |
          # Same install pattern as release.yml: chocolatey first, MSI
          # fallback if the choco package is delisted or fails. The
          # silent MSI install registers the kernel driver AND drops the
          # SDK headers/libs winfsp_wrs_sys's build script reads from
          # HKLM\SOFTWARE\WOW6432Node\WinFsp\InstallDir.
          $ErrorActionPreference = 'Continue'
          choco install winfsp -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\WinFsp\inc\winfsp\winfsp.h") -and
              -not (Test-Path "C:\Program Files\WinFsp\inc\winfsp\winfsp.h")) {
              Write-Host "==> choco install didn't drop WinFsp SDK, falling back to direct MSI"
              $msi = "$env:RUNNER_TEMP\winfsp.msi"
              Invoke-WebRequest `
                  -Uri "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi" `
                  -OutFile $msi
              Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          }
      - name: Verify WinFsp install
        shell: pwsh
        run: |
          # Surfaces a clear error early if the install above silently
          # failed - the integration tests would otherwise just print
          # `[skip]` and pass, defeating the point of running them in CI.
          $sdk = @(
              "C:\Program Files (x86)\WinFsp\inc\winfsp\winfsp.h",
              "C:\Program Files\WinFsp\inc\winfsp\winfsp.h"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          $drv = @(
              "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.sys",
              "C:\Program Files\WinFsp\bin\winfsp-x64.sys"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sdk) { Write-Error "WinFsp SDK headers missing"; exit 1 }
          if (-not $drv) { Write-Error "WinFsp kernel driver missing"; exit 1 }
          Write-Host "==> WinFsp ok (sdk=$sdk, driver=$drv)"
      - name: Put WinFsp's bin dir on PATH
        shell: pwsh
        # luksbox-mount is statically linked against winfsp-x64.lib, so
        # the test exes and luksbox.exe need winfsp-x64.dll to be
        # reachable by the Windows loader at startup. WinFsp ships the
        # DLL under <install>\bin\ but does NOT add that directory to
        # system PATH. Without this, the loader fails with
        # STATUS_DLL_NOT_FOUND (0xC0000135) before main() runs and the
        # process exits with that NTSTATUS as its exit code. The verify
        # step above already established that the bin dir exists in one
        # of the two standard locations. GITHUB_PATH prepends it for
        # every later step.
        run: |
          $winfspBin = if (Test-Path "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll") {
              "C:\Program Files (x86)\WinFsp\bin"
          } elseif (Test-Path "C:\Program Files\WinFsp\bin\winfsp-x64.dll") {
              "C:\Program Files\WinFsp\bin"
          } else {
              Write-Error "winfsp-x64.dll not found in either standard install location"
              exit 1
          }
          Write-Host "==> prepending WinFsp bin dir to PATH: $winfspBin"
          $winfspBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run WinFsp integration tests
        shell: pwsh
        # --test-threads=1 because the tests share the host's drive-letter
        # pool (D:..Z:) and parallel runs would race on the same letter.
        # --release because debug builds of winfsp_wrs_sys take ~3x longer
        # to link, and we don't need debug symbols here.
        run: cargo test --release -p luksbox-mount --test winfsp_mount -- --test-threads=1 --nocapture
      - name: Run cross-process mount / umount test (CLI)
        shell: pwsh
        # `luksbox mount` in one process, `luksbox umount Z:` in another
        # (GitHub #37), through the real luksbox.exe:
        # crates/luksbox-cli/tests/mount_cross_process.rs.
        # LUKSBOX_REQUIRE_MOUNT_TESTS: fail rather than skip if
        # luksbox.exe can't start (winfsp-x64.dll not found).
        env:
          LUKSBOX_REQUIRE_MOUNT_TESTS: "1"
        run: cargo test --release -p luksbox-cli --test mount_cross_process -- --nocapture
      - name: Run Windows extraction tests (junctions, 8.3 short names)
        shell: pwsh
        # The Windows-only checks in luksbox-core's
        # secure_create_or_truncate (used by `get`, GUI downloads, seed
        # files and hybrid sidecars): refuse a junction anywhere in the
        # path, accept 8.3 short names. Needs no WinFsp; lives in this job
        # to reuse its Windows runner.
        run: cargo test --release -p luksbox-core --test windows_extract_junction

  # ---- Security regression spotlight (always-green gate) ------------------
  # Runs JUST the 26 security regression tests added during the audit
  # rounds. Any failure here is a serious regression, these tests
  # encode the safe envelope of the three vulnerabilities we already
  # found (argon2 DoS, cred_id OOM, bincode-decode OOM). Surfacing
  # them as their own job makes the green/red signal unambiguous.
  security-regressions:
    name: security regressions (must stay green)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-security-regressions
      - name: Linux deps
        uses: ./.github/actions/apt-install
        with:
          packages: |
            pkg-config libfido2-dev libssl-dev libudev-dev zlib1g-dev
            libtss2-dev
      - name: Argon2id DoS guard (luksbox-core)
        run: cargo test -p luksbox-core --test argon2_dos_guard
      - name: Seed-file DoS guard (luksbox-pq)
        run: cargo test -p luksbox-pq --test seed_file_dos_guard
      - name: Rogue / MITM FIDO2 authenticator (luksbox-fido2)
        run: cargo test -p luksbox-fido2 --test rogue_authenticator
      - name: Postcard oversize-payload guard (luksbox-vfs)
        # Replaces the old `bincode_oom_guard` test, the codec moved
        # bincode to postcard. Same intent: reject attacker-controlled
        # length prefixes that would balloon allocation before
        # validation. Lives in metadata_format_v2.rs as
        # postcard_decoder_rejects_oversized_payload.
        run: cargo test -p luksbox-vfs --test metadata_format_v2 -- postcard_decoder_rejects_oversized_payload
      - name: FIPS 203 (ML-KEM-768/1024) conformance (luksbox-pq)
        run: cargo test -p luksbox-pq --test fips203_conformance
      - name: Hybrid-FIDO end-to-end (luksbox-pq)
        run: cargo test -p luksbox-pq --test end_to_end_hybrid
      - name: HKDF info-string uniqueness + slot-AAD coverage (luksbox-core, round 6)
        run: cargo test -p luksbox-core --test security_invariants
      - name: Header tamper coverage + concurrent open (luksbox-format, round 6)
        run: cargo test -p luksbox-format --test security_invariants
      - name: Cross-file chunk substitution + generation rollback (luksbox-vfs, round 6)
        run: cargo test -p luksbox-vfs --test security_invariants
      - name: AES-NI startup warning (luksbox-cli, round 6 item I)
        run: cargo test -p luksbox-cli --test functional -- aes

  # ---- Windows TPM 2.0 backend (TBS via bundled tpm2-tss) -----------------
  # Builds the real tss-esapi 8.x TBS backend on windows-latest and runs
  # the luksbox-tpm suite. Hosted runners expose no TPM device, so the
  # tests that pass here are the mock/wire ones; the live seal/unseal
  # smoke stays a manual step on real hardware:
  #   cargo run -p luksbox-tpm --features bundled-tpm --example tpm_smoke
  # The tpm2-tss/OpenSSL/libclang staging is the same composite action
  # release.yml's Windows lane uses, so CI and release can't drift.
  windows-tpm:
    name: windows tpm (TBS, bundled tpm2-tss)
    # Using windows-latest per request. The LNK1181 "cannot open input
    # file 'tss2-sys.lib'" seen in the test step on cee89b6 was a stale
    # rust-cache entry that skipped MSBuild; step d. of stage-tpm2-tss now
    # drops it. Should LNK1181 come back on a cold cache, suspect the
    # toolset instead (the tpm2-tss VS solution targets VS 2022 / v143,
    # windows-latest carries VS 2026): switch to windows-2025. Keep in
    # lock-step with the Windows lane in release.yml.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-windows-tpm
      - name: Stage tpm2-tss source + OpenSSL + libclang
        uses: ./.github/actions/stage-tpm2-tss
      - name: Build luksbox-tpm (real TBS backend)
        run: cargo build --release -p luksbox-tpm --features bundled-tpm
      - name: Test luksbox-tpm (mock + wire tests)
        shell: pwsh
        run: |
          # The test executables import the tss2-*.dll files MSBuild
          # just produced; cargo puts their directory on PATH via the
          # build script's link-search path. tss2-esys.dll additionally
          # imports libcrypto-3-x64.dll, whose staged directory is NOT
          # a link-search path, so prepend it here.
          $env:PATH = "C:\ossl\bin;$env:PATH"
          cargo test --release -p luksbox-tpm --features bundled-tpm

  # ---- Workspace builds (no tests, just ensure binaries link) -------------
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-22.04
    # Static-mode pkg-config + SM4-less vendored tpm2-tss for the
    # bundled-tpm lanes; see the comment on the `test` job's env
    # block. Inert on the lanes that never compile tss-esapi-sys
    # (cli-no-hardware, gui).
    env:
      TSS2_SYS_STATIC: "1"
      TSS2_ESYS_STATIC: "1"
      TSS2_MU_STATIC: "1"
      TSS2_TCTILDR_STATIC: "1"
      CFLAGS: "-DOPENSSL_NO_SM4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli-no-hardware
            cmd: "cargo build --release -p luksbox-cli"
            extra_apt: ""
          # bundled-tpm on the two TPM-enabled lanes below, not
          # `hardware`: this job runs on jammy, whose system tpm2-tss
          # (3.2) is below the 4.1.3 build floor of tss-esapi 8.x, so
          # the system link no longer builds here. bundled-tpm compiles
          # the pinned tpm2-tss (scripts/stage_tpm2_tss.sh) via autotools
          # at build time
          # (hence the autotools packages in extra_apt); the
          # system-link `hardware` flavour keeps being exercised by the
          # test-ubuntu-2604 job. This mirrors the jammy/noble release
          # lanes in release.yml.
          - target: cli-bundled-tpm
            cmd: "cargo build --release -p luksbox-cli --features bundled-tpm"
            extra_apt: "autoconf automake libtool libltdl-dev autoconf-archive libjson-c-dev uuid-dev"
          - target: gui
            cmd: "cargo build --release -p luksbox-gui"
            extra_apt: ""
          # luksbox-tpm real backend: vendored tpm2-tss for the build,
          # plus `swtpm` (software TPM emulator) at test time so the
          # integration tests in tests/swtpm_*.rs exercise actual
          # seal/unseal against a TCG-compliant chip. Stub-only build
          # is verified by the workspace default build above; this
          # matrix entry is the only one that exercises the real
          # tss-esapi-sys link AND the live TPM round-trip. swtpm comes
          # with swtpm_setup which is what initialises the EK
          # certificate before swtpm starts. libtss2-tcti-swtpm0
          # provides the tcti library for the `swtpm:path=...` TCTI
          # string the tests use; the vendored tss2-tctildr dlopen()s
          # it at runtime through the stable TCTI plugin ABI.
          - target: tpm-bundled
            cmd: "cargo build --release -p luksbox-tpm --features bundled-tpm && cargo test --release -p luksbox-tpm --features bundled-tpm"
            extra_apt: "swtpm swtpm-tools libtss2-tcti-swtpm0 autoconf automake libtool libltdl-dev autoconf-archive libjson-c-dev uuid-dev"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # `-tss420`: see the test job; drops caches holding the old
          # vendored tpm2-tss 4.1.3.
          shared-key: ci-build-tss420-${{ matrix.target }}
      - name: Linux deps
        uses: ./.github/actions/apt-install
        with:
          packages: |
            pkg-config libfido2-dev libssl-dev libudev-dev zlib1g-dev
            libtss2-dev
            ${{ matrix.extra_apt }}
      - name: Stage pinned tpm2-tss source (bundled-tpm entries)
        if: contains(matrix.cmd, 'bundled-tpm')
        run: echo "TPM2_TSS_SOURCE_PATH=$(bash scripts/stage_tpm2_tss.sh "$RUNNER_TEMP/tpm2-tss-src")" >> "$GITHUB_ENV"
      - name: Build
        run: ${{ matrix.cmd }}

  # ---- Quick fuzz smoke (5 min per target) --------------------------------
  # Runs the libFuzzer harnesses with the persistent corpus + 5 min
  # wall-clock cap per target. Surfaces any trivially-reachable new
  # crash introduced by a PR. The longer AFL++ campaigns live in
  # scripts/fuzz_server.sh and are server-side.
  #
  # Runs on:
  #   - PRs           : catch parser regressions before merge
  #   - manual dispatch: ad-hoc smoke
  #   - tag pushes    : gate releases on a fresh fuzz pass
  # Skipped on plain push to main (PR was already fuzzed at review time).
  fuzz-smoke:
    # No `${{ matrix.target }}` in the name, GitHub auto-appends the
    # matrix value to the display anyway ("fuzz smoke (header_parse)"
    # etc.). Hard-coding the placeholder here makes skipped jobs show
    # the raw template literally because the matrix isn't expanded
    # when the job-level `if:` evaluates false.
    name: fuzz smoke
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    strategy:
      fail-fast: false
      matrix:
        target:
          - header_parse
          - keyslot_parse
          - metadata_parse
          - hybrid_sidecar_parse
          - seed_file_parse
          - auth_then_process
          - header_roundtrip
          - winfsp_path_parse
          - webauthn_device_path
          - deniable_header_parse
          - slot_payload_decode
          - slot_payload_roundtrip
          # 2026-05 additions: chunk AEAD callsite + anchor parsers.
          # Both are cheap per iteration, fit comfortably in the 5-min
          # smoke budget. See FUZZING.md for the threat model.
          - chunk_aead_decrypt
          - anchor_parse
          # Round 12 addition: multi-slot envelope opacity. Builds a
          # real deniable header with a fuzzer-selected subset of slots
          # enrolled, then drives the envelope-discovery loop with
          # attacker input. Pins R12-01's opacity invariant.
          - deniable_envelope_multi_slot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly branch
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-fuzz-smoke
          workspaces: "fuzz"
      - name: Linux deps
        uses: ./.github/actions/apt-install
        with:
          packages: |
            pkg-config libfido2-dev libssl-dev libudev-dev zlib1g-dev clang
      # NB: no `--locked`. cargo-fuzz 0.13.x ships a Cargo.lock that
      # pins `rustix = 0.36.5`, which uses internal rustc attributes
      # (`rustc_layout_scalar_valid_range_*`) without enabling the
      # `feature(rustc_attrs)` gate. Recent nightly rejects this with
      # "attributes starting with `rustc` are reserved", breaking the
      # install. Dropping `--locked` lets cargo resolve to a newer
      # rustix patch in the 0.36.x line that fixed the issue.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz ${{ matrix.target }} for 5 minutes
        run: |
          cd "$GITHUB_WORKSPACE"
          # Defensively create the corpus dir if the repo doesn't ship
          # one yet (cargo-fuzz refuses with "required directory does
          # not exist" otherwise). Empty dirs aren't tracked by git so
          # a freshly-added target without seeds would otherwise fail
          # CI on its first run.
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} \
            -- -max_total_time=300
      - name: Upload any crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

  # cargo-audit walks Cargo.lock against the RustSec advisory DB and
  # fails on any non-ignored advisory. The single accepted ignore
  # (RUSTSEC-2025-0026, `registry` unmaintained, transitive via
  # winfsp_wrs on Windows) is documented in .cargo/audit.toml (the
  # only project-local path cargo-audit loads) and in SECURITY.md
  # "Unmaintained dependencies". The quick-xml advisory pair is
  # resolved for real by pinning wayland-scanner to a patched fork
  # commit (see the [patch.crates-io] comment in Cargo.toml). A new advisory
  # landing on a real (non-dev, non-Windows) dep makes this job
  # fail and the PR red.
  audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-audit
      - name: Install cargo-audit
        # cargo-audit 0.22.x is the first line that understands the
        # CVSS 4.0 vector format used by recent advisories (e.g.
        # RUSTSEC-2025-0138 against the deno crate). 0.21.x still
        # in use elsewhere errors out with "unsupported CVSS
        # version: 4.0" on the very next advisory-DB sync.
        run: cargo install --locked cargo-audit@^0.22
      - name: Run cargo audit
        run: cargo audit
